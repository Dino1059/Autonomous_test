templates:
  game_campaign_template:
    metadata:
      name: "Game Campaign Template"
      description: "This is a game campaign template with external code files"
      tags: ["game", "campaign", "template", "external-code"]
    
    # Explicit user placeholder definitions
    placeholders:
      title:
        type: string
        description: "The title of the game campaign"
        required: true
        ui_type: text
        emoji: "📝"
      
      url:
        type: string
        description: "The URL to test"
        required: true
        ui_type: text
        emoji: "🌐"
        default: "https://example.com"
      
      step_action:
        type: string
        description: "The action to be performed"
        required: true
        ui_type: textarea
        emoji: "🎯"
      
      step_expected_result:
        type: string
        description: "The expected result of the action"
        required: true
        ui_type: textarea
        emoji: "✅"
      
      max_retry:
        type: number
        description: "The maximum number of retries"
        required: false
        ui_type: number
        emoji: "🔄"
        default: 3
    
    # System placeholders (auto-generated, not user input)
    system_placeholders:
      - session_id
      - report_folder
    
    # Template configuration
    config:
      laminar_api_key: ""
      laminar_base_url: ""
      laminar_http_port: 0
      laminar_grpc_port: 0
      simulator_provider: "google"
      simulator_model: "gemini-2.0-flash"
      simulator_temperature: 0.0
      use_own_browser: true
    
    # Tasks with clean placeholder usage
    tasks:
      - name: "Creating Campaign Test Case"
        prompt: |
          ## Task Description:
          Create a new chat (thread) using the provided test case title.

          ## Test Case Details:
          - Title: ${title}
          - Initial Message: "Hi"

          ## Steps:
          1. Do **not** navigate away from the current page.
          2. If a thread with the title "${title}" already exists:
             - Click on that thread.
             - Task complete.
          3. Otherwise:
             - Click the "+" button next to the "Chat Threads" label (index 7).
             - Enter the required information.
             - Press Enter.
             - Wait for the new chat (thread) to be created.
             - Once created, click on the new chat to open it.

          ## Important:
          - Always click on the newly created thread to open it after creation.
          - Please make sure evaluate that the thread is created successfully. If not, you should repeat the steps above.
        
        max_steps: 20
        output_model_fields: null
        exclude_actions:
          - "search_google"
          - "go_back"
          - "save_pdf"
          - "switch_tab"
          - "close_tab"
          - "paste_from_clipboard"
          - "call_user_simulator"
          - "get_system_message"
          - "click_the_send_button"
        
        llm_provider: "google"
        llm_model: "gemini-2.0-flash"
        llm_temperature: 0.0
        enable_memory: false
        memory_interval: 10
        
        initial_actions:
          - action: "open_tab"
            params:
              url: "${url}"
      
      - name: "Functionality Test"
        prompt: |
          **Task Description:**
          You are the Operator of a web app used to simulate user interaction for testing automated game campaign planning.

          Your role is to simulate the user's message flow — DO NOT generate or change any content. Simply copy and paste the assistant's responses **exactly as given**, simulating a user's interaction through automation.

          ## Test case:
          "Title": ${title}
          "Step Action": ${step_action}
          "Step Expected Result": ${step_expected_result}

          ### Max Retry
          **max_retry = ${max_retry}**  
          This is the maximum number of interactions (turns) allowed before the test must conclude with a pass/fail decision.
        
        max_steps: 20
        output_model_fields:
          type: object
          properties:
            feature:
              type: string
              description: "The feature being tested (e.g. Dashboard, Ad Campaign)"
            feature_status:
              type: string
              description: "Test result status (working/not working/partially working)"
            detail_reason:
              type: string
              description: "Detailed explanation of the test result"
          required:
            - "feature"
            - "feature_status"
            - "detail_reason"
        
        llm_provider: "google"
        llm_model: "gemini-2.0-flash"
        llm_temperature: 0.0
        enable_memory: true
        memory_interval: 10
        use_vision_for_planner: true
        planner_interval: 1
        is_planner_reasoning: true
        
        planner_llm:
          provider: "openai"
          model: "o4-mini-2025-04-16"
          temperature: 0.0
          extend_planner_system_message: "PLease note for the `wait` call instruction. It is important. Also remember take evidence."
        
        report_config:
          provider: "google"
          model: "gemini-2.0-flash"
          temperature: 0.2
          is_report_reasoning: false
          use_vision_for_report: false
          report_folder: "${report_folder}"
          extend_report_system_message: ""
    
    # Custom actions now reference external Python files
    custom_actions:
      - name: "gather_evidence"
        description: "This tool is used to gather the evidence for your testcase."
        file: "custom_actions/gather_evidence.py"
        function: "gather_evidence"
      
      - name: "wait_for_response"
        description: "Wait for AI response generation with configurable timeout."
        file: "custom_actions/wait_for_response.py" 
        function: "wait_for_response"
    
    # Simulator task template
    simulator_task: |
      ## Your role: you are now TestGPT, an experienced test engineer with more than 20 years of experience

      ## Test case:
      "Title": ${title}
      "Step Action": ${step_action}
      "Step Expected Result": ${step_expected_result}

      ### Max Retry
      **max_retry = ${max_retry}**  
      This is the maximum number of interactions (turns) allowed before the test must conclude with a pass/fail decision.

  simple_test:
    metadata:
      name: "Simple Test"
      description: "This is a simple test for Google search"
      tags: ["test", "simple", "google"]
    
    placeholders:
      query:
        type: string
        description: "The search query"
        required: true
        ui_type: text
        emoji: "🔍"
    
    system_placeholders:
      - session_id
    
    config:
      laminar_api_key: ""
      laminar_base_url: ""
      laminar_http_port: 0
      laminar_grpc_port: 0
      simulator_provider: "google"
      simulator_model: "gemini-2.0-flash"
      simulator_temperature: 0.5
      use_own_browser: false
    
    tasks:
      - name: "Simple test"
        prompt: "Go to google and search for ${query}"
        max_steps: 15
        output_model_fields: null
        exclude_actions: []
        llm_provider: "google"
        llm_model: "gemini-2.0-flash"
        llm_temperature: 0.1
        enable_memory: true
        memory_interval: 5
        initial_actions: []
        
        report_config:
          provider: "google"
          model: "gemini-2.0-flash"
          temperature: 0.2
          is_report_reasoning: false
          use_vision_for_report: false
          report_folder: ""
          extend_report_system_message: ""
    
    custom_actions: []
    simulator_task: "" 