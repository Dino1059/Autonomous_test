metadata:
  name: "Simple Test"
  description: "This is a simple test for Google search"
  tags: ["test", "simple", "google"]

placeholders:
  query:
    type: string
    description: "Input to search google"
    required: true
    ui_type: text
    emoji: "🔍"
  query2:
    type: string
    description: "Input to search youtube"
    required: true
    ui_type: text
    emoji: "🔍"

system_placeholders:
  - session_id

config:
  laminar_api_key: ""
  laminar_base_url: ""
  laminar_http_port: 0
  laminar_grpc_port: 0
  simulator_provider: "google"
  simulator_model: "gemini-2.0-flash"
  simulator_temperature: 0.5
  custom_actions: []
  simulator_task: ""
  browser_config:
    user_data_dir: "C:/Users/anpro/.config/browseruse/profiles/default"
    keep_alive: true
    headless: false
    viewport:
      width: 1920
      height: 1080

tasks:
  - name: "First task"
    prompt: "Go to google and search for ${query}, then call the action gather_evidence for save screenshot. Done task"
    max_steps: 15
    output_model_fields: null
    exclude_actions:
      - "go_back"
      - "save_pdf"
      - "switch_tab"
      - "close_tab"
      - "paste_from_clipboard"
      - "call_user_simulator"
      - "get_system_message"
      - "click_the_send_button"
    llm_provider: "openai"
    llm_model: "gpt-4o-mini"
    llm_temperature: 0.1
    enable_memory: true
    memory_interval: 5
    initial_actions:
      - open_tab:
          url: "https://www.facebook.com/"
    
  - name: "Second task"
    prompt: "Go to youtube and play for ${query2}, then call the action gather_evidence for save screenshot"
    max_steps: 15
    output_model_fields: null
    exclude_actions:
      - "go_back"
      - "save_pdf"
      - "switch_tab"
      - "close_tab"
      - "paste_from_clipboard"
      - "call_user_simulator"
      - "get_system_message"
      - "click_the_send_button"
    llm_provider: "openai"
    llm_model: "gpt-4o-mini"
    llm_temperature: 0.1
    enable_memory: true
    memory_interval: 5
    initial_actions: []
    
    report_config:
      provider: "google"
      model: "gemini-2.0-flash"
      temperature: 0.2
      is_report_reasoning: false
      use_vision_for_report: false
      report_folder: ""
      extend_report_system_message: ""
  
custom_actions:
  - name: "gather_evidence. This tool is used to gather the evidence for your testcase."
    file: "custom_actions/gather_evidence.py"
    function: "gather_evidence"
  
  - name: "wait_for_response. Wait for AI response generation with configurable timeout."
    file: "custom_actions/wait_for_response.py" 
    function: "wait_for_response"