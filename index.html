  <!-- Liquid-glass utilities -->
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
    }

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
      rgba(255,255,255,0.45) 0%,
      rgba(255,255,255,0.15) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.15) 80%,
      rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
      rgba(255,255,255,0.5) 0%,
      rgba(255,255,255,0.2) 20%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.2) 80%,
      rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>

<body class="bg-black text-white">
  <div id="root"></div>

  <script type="text/babel">
    // Suppress benign Framer Motion dev warnings about list keys
    const origError = console.error;
    console.error = (...args) => {
      if (typeof args[0] === 'string' && (args[0].includes('Warning: Each child in a list') || args[0].includes('Framer Motion'))) return;
      origError(...args);
    };

    const { motion } = window.FramerMotion;

    // SVG Icons
    const ArrowUpRightIcon = ({ className = "h-5 w-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M7 17L17 7" />
        <path d="M7 7h10v10" />
      </svg>
    );

    const PlayIcon = ({ className = "h-4 w-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6 4 20 12 6 20 6 4" />
      </svg>
    );

    const ClockIcon = ({ className = "w-[28px] h-[28px]" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </svg>
    );

    const GlobeIcon = ({ className = "w-[28px] h-[28px]" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="2" y1="12" x2="22" y2="12" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
    );

    // FadingVideo component (custom JS crossfade, no CSS transitions)
    const FadingVideo = ({ src, className, style }) => {
      const videoRef = React.useRef(null);
      const rafIdRef = React.useRef(null);
      const fadingOutRef = React.useRef(false);

      const FADE_MS = 500;
      const FADE_OUT_LEAD = 0.55;

      const fadeTo = React.useCallback((target, duration) => {
        const video = videoRef.current;
        if (!video) return;

        if (rafIdRef.current) {
          cancelAnimationFrame(rafIdRef.current);
          rafIdRef.current = null;
        }

        const currentOpacity = parseFloat(video.style.opacity) || 0;
        const startOpacity = currentOpacity;
        const opacityDiff = target - startOpacity;
        if (Math.abs(opacityDiff) < 0.001) {
          video.style.opacity = target.toString();
          return;
        }

        const startTime = performance.now();

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const newOpacity = startOpacity + opacityDiff * progress;
          if (videoRef.current) {
            videoRef.current.style.opacity = newOpacity.toString();
          }

          if (progress < 1) {
            rafIdRef.current = requestAnimationFrame(step);
          } else {
            rafIdRef.current = null;
          }
        };

        rafIdRef.current = requestAnimationFrame(step);
      }, []);

      React.useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const handleLoadedData = () => {
          video.style.opacity = '0';
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.catch((e) => {
              console.log('Autoplay prevented/interrupted:', e);
            });
          }
          fadeTo(1, FADE_MS);
        };

        const handleTimeUpdate = () => {
          if (!video.duration || isNaN(video.duration)) return;
          const remaining = video.duration - video.currentTime;
          if (!fadingOutRef.current && remaining <= FADE_OUT_LEAD && remaining > 0) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const handleEnded = () => {
          video.style.opacity = '0';
          setTimeout(() => {
            if (!videoRef.current) return;
            videoRef.current.currentTime = 0;
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch((e) => console.log('Replay error:', e));
            }
            fadingOutRef.current = false;
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener('loadeddata', handleLoadedData);
        video.addEventListener('timeupdate', handleTimeUpdate);
        video.addEventListener('ended', handleEnded);

        if (video.readyState >= 2) {
          handleLoadedData();
        }

        return () => {
          if (rafIdRef.current) {
            cancelAnimationFrame(rafIdRef.current);
          }
          video.removeEventListener('loadeddata', handleLoadedData);
          video.removeEventListener('timeupdate', handleTimeUpdate);
          video.removeEventListener('ended', handleEnded);
        };
      }, [fadeTo, src]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ opacity: 0, ...style }}
        />
      );
    };

    // BlurText Component (word-by-word blur-in)
    const BlurText = ({ text, className = '' }) => {
      const containerRef = React.useRef(null);
      const [isInView, setIsInView] = React.useState(false);

      React.useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsInView(true);
            }
          },
          { threshold: 0.1 }
        );

        if (containerRef.current) {
          observer.observe(containerRef.current);
        }

        return () => observer.disconnect();
      }, []);

      const words = text.split(' ');

      return (
        <p
          ref={containerRef}
          className={className}
          style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
        >
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
              animate={
                isInView
                  ? {
                      filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                      opacity: [0, 0.5, 1],
                      y: [50, -5, 0],
                    }
                  : { filter: 'blur(10px)', opacity: 0, y: 50 }
              }
              transition={{
                duration: 0.7,
                times: [0, 0.5, 1],
                ease: 'easeOut',
                delay: (i * 100) / 1000,
              }}
              style={{ display: 'inline-block', marginRight: '0.28em' }}
            >
              {word}
            </motion.span>
          ))}
        </p>
      );
    };

    // Navbar
    const Navbar = () => {
      return (
        <header className="fixed top-4 left-0 right-0 px-8 lg:px-16 z-50 flex items-center justify-between pointer-events-none">
          {/* Left: 48x48 liquid-glass circle */}
          <div className="w-12 h-12 rounded-full liquid-glass flex items-center justify-center pointer-events-auto cursor-pointer">
            <span className="font-heading italic text-white text-2xl pb-1 select-none">a</span>
          </div>

          {/* Center (desktop only): liquid-glass pill */}
          <nav className="hidden md:flex items-center liquid-glass rounded-full px-1.5 py-1.5 gap-1 pointer-events-auto">
            {['Home', 'Voyages', 'Worlds', 'Innovation', 'Plan Launch'].map((link) => (
              <a
                key={link}
                href={`#${link.toLowerCase().replace(/\s+/g, '-')}`}
                className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors cursor-pointer"
              >
                {link}
              </a>
            ))}
            <button className="bg-white text-black rounded-full px-4 py-2 text-sm font-medium flex items-center gap-1.5 font-body cursor-pointer hover:bg-white/90 transition-colors whitespace-nowrap ml-1">
              <span>Claim a Spot</span>
              <ArrowUpRightIcon className="h-4 w-4" />
            </button>
          </nav>

          {/* Right: 48x48 invisible spacer */}
          <div className="w-12 h-12 invisible" aria-hidden="true" />
        </header>
      );
    };

    // Section 1 — Hero
    const HeroSection = () => {
      return (
        <section className="relative min-h-screen w-full bg-black text-white flex flex-col justify-between overflow-hidden select-none">
          {/* Background Video */}
          <FadingVideo
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
            className="absolute left-1/2 top-0 -translate-x-1/2 object-cover object-top z-0"
            style={{ width: "120%", height: "120%" }}
          />

          {/* Content Layer (z-10) */}
          <div className="relative z-10 flex flex-col min-h-screen justify-between pt-24">
            {/* Hero Content (centered) */}
            <div className="flex-1 flex flex-col items-center justify-center text-center px-4 pt-12 pb-8">
              {/* Badge */}
              <motion.div
                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 0.4, ease: 'easeOut' }}
                className="liquid-glass rounded-full p-1 pr-3 flex items-center gap-2.5 cursor-pointer hover:bg-white/5 transition-colors"
              >
                <span className="bg-white text-black rounded-full px-3 py-1 text-xs font-semibold font-body">New</span>
                <span className="text-sm text-white/90 font-body">Maiden Crewed Voyage to Mars Arrives 2026</span>
              </motion.div>

              {/* Headline */}
              <BlurText
                text="Venture Past Our Sky Across the Universe"
                className="text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.8] max-w-2xl justify-center tracking-[-4px] mt-6"
              />

              {/* Subheading */}
              <motion.p
                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 0.8, ease: 'easeOut' }}
                className="mt-4 text-sm md:text-base text-white max-w-2xl font-body font-light leading-tight"
              >
                Discover the universe in ways once unimaginable. Our pioneering vessels and breakthrough engineering bring deep-space exploration within reach—secure and extraordinary.
              </motion.p>

              {/* CTAs */}
              <motion.div
                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 1.1, ease: 'easeOut' }}
                className="flex items-center gap-6 mt-6"
              >
                <button className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white flex items-center gap-2 cursor-pointer hover:bg-white/10 transition-colors font-body">
                  <span>Start Your Voyage</span>
                  <ArrowUpRightIcon className="h-5 w-5" />
                </button>
                <a href="#liftoff" className="flex items-center gap-2 text-sm font-medium text-white/90 hover:text-white transition-colors cursor-pointer font-body">
                  <span>View Liftoff</span>
                  <PlayIcon className="h-4 w-4" />
                </a>
              </motion.div>

              {/* Stats Row */}
              <motion.div
                initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                transition={{ duration: 0.8, delay: 1.3, ease: 'easeOut' }}
                className="flex items-stretch gap-4 mt-8"
              >
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between items-start text-left">
                  <ClockIcon className="w-[28px] h-[28px] text-white" />
                  <div className="mt-4">
                    <div className="text-4xl font-heading italic tracking-[-1px] leading-none text-white">34.5 Min</div>
                    <div className="text-xs text-white font-body font-light mt-2">Average Videos Watch Time</div>
                  </div>
                </div>
                <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between items-start text-left">
                  <GlobeIcon className="w-[28px] h-[28px] text-white" />
                  <div className="mt-4">
                    <div className="text-4xl font-heading italic tracking-[-1px] leading-none text-white">2.8B+</div>
                    <div className="text-xs text-white font-body font-light mt-2">Users Across the Globe</div>
                  </div>
                </div>
              </motion.div>
            </div>

            {/* Partners (bottom of hero) */}
            <motion.div
              initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
              animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
              transition={{ duration: 0.8, delay: 1.4, ease: 'easeOut' }}
              className="flex flex-col items-center gap-4 pb-8"
            >
              <div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white font-body">
                Collaborating with top aerospace pioneers globally
              </div>
              <div className="font-heading italic text-white text-2xl md:text-3xl tracking-tight flex items-center justify-center gap-12 md:gap-16 flex-wrap">
                <span>Aeon</span>
                <span>Vela</span>
                <span>Apex</span>
                <span>Orbit</span>
                <span>Zeno</span>
              </div>
            </motion.div>
          </div>
        </section>
      );
    };

    // Section 2 — Capabilities
    const CapabilitiesSection = () => {
      const cardsData = [
        {
          title: "AI Scenery",
          body: "AI analyzes your product to create indistinguishable natural environments — from Icelandic cliffs to misty forests.",
          iconPath: "M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z",
          tags: ["Natural Context", "Photo Realism", "Infinite Settings", "Eco-Vibe"]
        },
        {
          title: "Batch Production",
          body: "Style your entire product line in minutes. Create a unified visual identity for catalogues and social media without weeks of retouching.",
          iconPath: "M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z",
          tags: ["Scale Fast", "Visual Consistency", "Time Saver", "Ready to Post"]
        },
        {
          title: "Smart Lighting",
          body: "Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight.",
          iconPath: "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",
          tags: ["Ray Tracing", "Physical Shadows", "Studio Quality", "Sunlight Sync"]
        }
      ];

      return (
        <section className="relative min-h-screen w-full bg-black text-white flex flex-col justify-between overflow-hidden select-none">
          {/* Background Video */}
          <FadingVideo
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
            className="absolute inset-0 w-full h-full object-cover z-0"
          />

          {/* Content Layer (relative z-10) */}
          <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-24 pb-10 flex flex-col min-h-screen justify-between">
            {/* Header */}
            <div className="mb-auto">
              <div className="text-sm font-body text-white/80 mb-6 tracking-wide">// Capabilities</div>
              <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
                Production<br />evolved
              </h2>
            </div>

            {/* Three Cards Grid */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16 pb-6">
              {cardsData.map((card, idx) => (
                <div key={idx} className="liquid-glass rounded-[1.25rem] p-6 min-h-[360px] flex flex-col justify-between">
                  {/* Top Row */}
                  <div className="flex items-start justify-between gap-4">
                    {/* Left Icon Square */}
                    <div className="w-11 h-11 rounded-[0.75rem] liquid-glass flex items-center justify-center shrink-0">

                        <path d={card.iconPath} />
                      </svg>
                    </div>

                    {/* Right Tags */}
                    <div className="flex flex-wrap justify-end gap-1.5 max-w-[70%]">
                      {card.tags.map((tag, tIdx) => (
                        <span key={tIdx} className="liquid-glass rounded-full px-3 py-1 text-[11px] text-white/90 font-body whitespace-nowrap">
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>

                  {/* Middle Spacer */}
                  <div className="flex-1" />

                  {/* Bottom */}
                  <div className="mt-6">
                    <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">
                      {card.title}
                    </h3>
                    <p className="mt-3 text-sm text-white/90 font-body font-light leading-snug max-w-[32ch]">
                      {card.body}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // Main App
    const App = () => {
      return (
        <div className="min-h-screen bg-black text-white relative selection:bg-white selection:text-black">
          <Navbar />
          <HeroSection />
          <CapabilitiesSection />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
